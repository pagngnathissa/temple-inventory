{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-warning text-dark fw-bold">
                <i class="fas fa-key me-2"></i> මුරපදය වෙනස් කිරීම
            </div>
            <div class="card-body bg-light p-4">
                <form action="" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">දැනට භාවිතා කරන මුරපදය</label>
                        <input type="password" class="form-control" name="current_password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">නව මුරපදය</label>
                        <input type="password" class="form-control" name="new_password" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold mb-2">මුරපදය වෙනස් කරන්න</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100">ආපසු</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
